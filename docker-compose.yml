services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: talent_docs
      POSTGRES_USER: talent
      POSTGRES_PASSWORD: talent_dev_password
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U talent -d talent_docs"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: chrislusf/seaweedfs:4.48
    restart: unless-stopped
    environment:
      AWS_ACCESS_KEY_ID: talent_minio
      AWS_SECRET_ACCESS_KEY: talent_minio_password
      S3_BUCKET: talent-documents
    ports:
      - "127.0.0.1:19000:8333"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9333/cluster/status"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:6-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:16379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  etcd:
    image: quay.io/coreos/etcd:v3.5.18
    restart: unless-stopped
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls=http://0.0.0.0:2379 --data-dir=/etcd
    volumes:
      - etcd_data:/etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 5s
      timeout: 3s
      retries: 20

  milvus:
    image: milvusdb/milvus:v2.6.17
    restart: unless-stopped
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:8333
      MINIO_ACCESS_KEY_ID: talent_minio
      MINIO_SECRET_ACCESS_KEY: talent_minio_password
    ports:
      - "127.0.0.1:19531:19530"
      - "127.0.0.1:19091:9091"
    volumes:
      - milvus_data:/var/lib/milvus
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 10s
      timeout: 5s
      retries: 30

  backend:
    profiles: ["app"]
    image: talent-eval-agents-course-backend:latest
    restart: unless-stopped
    build: ./backend
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://talent:talent_dev_password@postgres:5432/talent_docs
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT_URL: http://minio:8333
      S3_PUBLIC_ENDPOINT_URL: http://127.0.0.1:19000
      S3_ACCESS_KEY: talent_minio
      S3_SECRET_KEY: talent_minio_password
      S3_BUCKET: talent-documents
      MINERU_URL: http://host.docker.internal:18001
      MILVUS_URI: http://milvus:19530
      MILVUS_TOKEN: root:Milvus
      MILVUS_COLLECTION: talent_evidence_v2
      EMBEDDING_DIMENSION: 1024
      LOG_DIR: /app/logs
      SERVICE_NAME: backend
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:18080:18080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:18080/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    volumes:
      - ./backend/logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      milvus:
        condition: service_healthy

  worker:
    profiles: ["app"]
    image: talent-eval-agents-course-backend:latest
    restart: unless-stopped
    build: ./backend
    env_file:
      - .env
    command: ["uv", "run", "--no-sync", "python", "-m", "app.worker"]
    environment:
      DATABASE_URL: postgresql+psycopg://talent:talent_dev_password@postgres:5432/talent_docs
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT_URL: http://minio:8333
      S3_PUBLIC_ENDPOINT_URL: http://127.0.0.1:19000
      S3_ACCESS_KEY: talent_minio
      S3_SECRET_KEY: talent_minio_password
      S3_BUCKET: talent-documents
      MINERU_URL: http://host.docker.internal:18001
      MILVUS_URI: http://milvus:19530
      MILVUS_TOKEN: root:Milvus
      MILVUS_COLLECTION: talent_evidence_v2
      EMBEDDING_DIMENSION: 1024
      LOG_DIR: /app/logs
      SERVICE_NAME: worker
      TZ: Asia/Shanghai
    volumes:
      - ./backend/logs:/app/logs
    depends_on:
      backend:
        condition: service_healthy

  frontend:
    profiles: ["app"]
    build: ./frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:15173:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  minio_data:
  etcd_data:
  milvus_data:
